# Single-tenant deployment: one container, one volume, no orchestration.
#
# The database is SQLite because for one tenant that is the right answer — a
# file, no second process, and WAL handles the concurrency of a handful of
# people editing their own documents. Everything below is configuration, so an
# installation that outgrows it changes environment rather than code.

services:
  server:
    # The published image; `docker compose build` rebuilds it from the
    # repository root instead (the client is part of the image, so the context
    # is the whole repo, not this directory).
    image: "${IMAGE:-ghcr.io/yendric/tectonic-editor:latest}"
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:?run `php artisan key:generate --show` and put it in .env}"

      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite

      # Where project content goes. Swap to s3 and fill in the AWS_* variables
      # to put it in a bucket instead; nothing above the blob store notices.
      BLOB_DISK: "${BLOB_DISK:-blobs}"
      FILESYSTEM_DISK: local

      # Sanctum has to be told which origins may hold a session, or a
      # first-party client is treated as a third-party one.
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-localhost}"
    volumes:
      - database:/app/database
      - storage:/app/storage
      - blobs:/srv/blobs
      # The TeX Live bundle is currently relayed from an object store (see the
      # Caddyfile), so no volume holds it. To self-host it instead, restore:
      # - "${BUNDLE_PATH:-./bundle}:/srv/bundle:ro"

volumes:
  database:
  storage:
  blobs:
