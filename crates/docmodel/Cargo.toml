lints.workspace = true

[package]
name = "texyon_docmodel"
version = "0.0.0-dev.0"  # assigned with cranko (see README)
authors = ["Peter Williams <peter@newton.cx>"]
description = """
The Tectonic document model and its serialization into `Texyon.toml`.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_docmodel"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
toml = { version = "^0.8" }

[package.metadata.internal_dep_versions]
texyon_errors = "5c9ba661edf5ef669f24f9904f99cca369d999e7"
