lints.workspace = true

[package]
name = "xtask"
version = "0.0.0"
description = "Build, test and profile TeXyoN's release artifacts"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
anyhow = "^1.0"
clap = { version = "^4.5", features = ["derive"] }
flate2 = "^1.0"
reqwest = { version = "^0.12", features = ["blocking"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tar = "^0.4"
texyon_preview_protocol = { path = "../preview_protocol", version = "0.0.0-dev.0", features = ["frame"] }
