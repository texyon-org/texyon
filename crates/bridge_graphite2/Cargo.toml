lints.workspace = true

[package]
name = "texyon_bridge_graphite2"
version = "0.0.0-dev.0" 
description = """
Expose the graphite2 library to Rust/Cargo.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bridge_graphite2"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2024"
links = "graphite2"

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "^1.0.66"
texyon_dep_support = { path = "../dep_support", version = "0.0.0-dev.0" }

