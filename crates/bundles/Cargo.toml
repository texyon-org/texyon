lints.workspace = true

[package]
name = "texyon_bundles"
version = "0.0.0-dev.0"
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Tectonic "bundle" (support file collection) implementations.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bundles"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"

[dependencies]
flate2 = { version = "^1.0.19", default-features = false, features = ["zlib"] }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_geturl = { path = "../geturl", version = "0.0.0-dev.0", default-features = false }
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }
zip = { version = "4", default-features = false, features = ["deflate"] }
url = "^2.0"

[features]
default = ["geturl-reqwest"]
geturl-curl = ["texyon_geturl/curl"]
geturl-reqwest = ["texyon_geturl/reqwest"]
geturl-wasm-fetch = ["texyon_geturl/wasm-fetch"]
native-tls-vendored = ["texyon_geturl/native-tls-vendored"]

