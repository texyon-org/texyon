lints.workspace = true

[package]
name = "texyon_bridge_freetype2"
version = "0.0.0-dev.0" 
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Expose the FreeType2 library C APIs to Rust/Cargo.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bridge_freetype2"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"
links = "freetype2"

[dependencies]
libc = "0.2"
texyon_bridge_png = { path = "../bridge_png", version = "0.0.0-dev.0" }
texyon_bridge_flate = { path = "../bridge_flate", version = "0.0.0-dev.0" }

[build-dependencies]
cc = "^1.0.66"
texyon_dep_support = { path = "../dep_support", version = "0.0.0-dev.0" }

