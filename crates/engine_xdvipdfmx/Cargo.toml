lints.workspace = true

[package]
name = "texyon_engine_xdvipdfmx"
version = "0.0.0-dev.0" 
authors = ["Peter Williams <peter@newton.cx>"]
description = """
The `xdvipdfmx` program as a reusable crate.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_engine_xdvipdfmx"
repository = "https://github.com/texyon-org/texyon"
