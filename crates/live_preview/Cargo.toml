lints.workspace = true

[package]
name = "texyon_live_preview"
version = "0.0.0-dev.0"  # assigned with cranko (see README)
authors = ["the Tectonic Project"]
description = """
Document-level orchestration for Tectonic's realtime LaTeX preview: source
authority, a resident engine driver, selective publication, and a JSON Lines
server.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_live_preview"
repository = "https://github.com/texyon-org/texyon"
license = "MIT"
edition = "2021"

[dependencies]
texyon_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
texyon_bundles = { path = "../bundles", version = "0.0.0-dev.0", optional = true }
texyon_engine_xdvipdfmx = { path = "../engine_xdvipdfmx", version = "0.0.0-dev.0" }
texyon_engine_xetex = { path = "../engine_xetex", version = "0.0.0-dev.0" }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
texyon_preview_protocol = { path = "../preview_protocol", version = "0.0.0-dev.0" }
texyon_preview_render = { path = "../preview_render", version = "0.0.0-dev.0" }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }

[package.metadata.internal_dep_versions]
texyon_bridge_core = "thiscommit:2026-07-25:live-preview-extraction"
texyon_bundles = "thiscommit:2026-07-25:live-preview-extraction"
texyon_engine_xdvipdfmx = "thiscommit:2026-11-05:portable-session"
texyon_engine_xetex = "thiscommit:2026-07-25:live-preview-extraction"
texyon_errors = "thiscommit:2026-07-25:live-preview-extraction"
texyon_io_base = "thiscommit:2026-07-25:live-preview-extraction"
texyon_preview_protocol = "thiscommit:2026-07-25:live-preview-extraction"
texyon_preview_render = "thiscommit:2026-07-25:live-preview-extraction"
texyon_status_base = "thiscommit:2026-07-25:live-preview-extraction"

[features]
default = ["native"]

# Host OS support: the bundle resource provider, the worker thread and the
# stdio JSON Lines server. The WebAssembly build links the portable core only.
native = ["dep:texyon_bundles"]

# The native SVG backend links MuPDF, whose distribution terms are AGPL. Keep
# it opt-in so the portable/MIT library build remains unchanged.
preview-mupdf = ["texyon_preview_render/backend-mupdf"]

[dev-dependencies]
serde_json = "1.0"
tempfile = "^3.1"
