lints.workspace = true

[package]
name = "texyon_live_preview"
version = "0.0.0-dev.0" 
description = """
Document-level orchestration for TeXyoN's realtime LaTeX preview: source
authority, a resident engine driver, selective publication, and one session
interface for every host.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_live_preview"
repository = "https://github.com/texyon-org/texyon"
license = "MIT"
edition = "2024"

[dependencies]
texyon_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
texyon_bundles = { path = "../bundles", version = "0.0.0-dev.0", optional = true }
texyon_engine_xdvipdfmx = { path = "../engine_xdvipdfmx", version = "0.0.0-dev.0" }
texyon_engine_xetex = { path = "../engine_xetex", version = "0.0.0-dev.0" }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
texyon_preview_protocol = { path = "../preview_protocol", version = "0.0.0-dev.0" }
texyon_preview_render = { path = "../preview_render", version = "0.0.0-dev.0" }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }
serde_json = { version = "1.0", optional = true }

[features]
default = ["native"]

# Host OS support: the bundle resource provider and the stream server.
# The WebAssembly build links the portable core only.
native = ["dep:texyon_bundles", "dep:serde_json", "texyon_preview_protocol/frame"]

# The native SVG backend links MuPDF, whose distribution terms are AGPL. Keep
# it opt-in so the portable/MIT library build remains unchanged.
preview-mupdf = ["texyon_preview_render/backend-mupdf"]

[dev-dependencies]
serde_json = "1.0"
tempfile = "^3.1"
