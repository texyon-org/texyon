lints.workspace = true

[package]
name = "texyon_bridge_png"
license = "MIT"
version = "0.0.0-dev.0"
edition = "2024"
links = "png"
description = """
Exposing PNG APIs to the Tectonic C/C++ and Rust code.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bridge_png"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"

# On wasm there is no system libpng, so we compile the vendored sources and
# need zlib's headers. libz-sys is already in the tree by way of flate2.
[target.'cfg(target_family = "wasm")'.dependencies]
libz-sys = "^1.1"

[build-dependencies]
cc = "^1.0.66"
texyon_dep_support = { path = "../dep_support", version = "0.0.0-dev.0" }

