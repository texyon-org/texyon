[package]
name = "texyon_preview_protocol"
version = "0.0.0-dev.0"
license = "MIT"
edition = "2024"
description = "Messages shared by TeXyoN's live-preview hosts"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rmp-serde = { version = "1.3", optional = true }

[features]
# The byte-stream framing a native host and its clients speak.
frame = ["dep:rmp-serde"]

[lints]
workspace = true
