lints.workspace = true

[package]
name = "texyon_bridge_core"
version = "0.0.0-dev.0" 
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Exposing core backend APIs to the Tectonic C/C++ code.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bridge_core"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"
links = "texyon_bridge_core"

[dependencies]
flate2 = { version = "^1.0", default-features = false, features = ["zlib"] }
lazy_static = "^1.4"
libc = "^0.2"
md-5 = "^0.10"
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }

[build-dependencies]
cc = "^1.0.66"

