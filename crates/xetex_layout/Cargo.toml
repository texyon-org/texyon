lints.workspace = true

[package]
name = "texyon_xetex_layout"
version = "0.0.0-dev.0"
description = """
XeTeX's font loading and layout interface encapsulation, as a crate.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_xetex_layout"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2024"

[dependencies]
texyon_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
texyon_bridge_freetype2 = { path = "../bridge_freetype2", version = "0.0.0-dev.0" }
texyon_bridge_graphite2 = { path = "../bridge_graphite2", version = "0.0.0-dev.0" }
texyon_bridge_harfbuzz = { path = "../bridge_harfbuzz", version = "0.0.0-dev.0" }
texyon_bridge_icu = { path = "../bridge_icu", version = "0.0.0-dev.0" }
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
libc = "0.2"
enrede = { version = "0.2", features = ["alloc"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
texyon_bridge_fontconfig = { path = "../bridge_fontconfig", version = "0.0.0-dev.0" }

[target.'cfg(target_os = "macos")'.dependencies]
texyon_mac_core = { path = "../mac_core", version = "0.0.0-dev.0" }

[features]
external-harfbuzz = ["texyon_bridge_harfbuzz/external-harfbuzz"]

