lints.workspace = true

[package]
name = "texyon_geturl"
version = "0.0.0-dev.0"  # assigned with cranko (see README)
authors = ["Peter Williams <peter@newton.cx>"]
description = """
A generic interface for HTTP GETs and byte-range requests, with pluggable backends.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_geturl"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"

[dependencies]
cfg-if = "^1.0"
curl = { version = "^0.4", optional = true }
reqwest = { version = "^0.12", optional = true, features = ["blocking"] }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }

[features]
default = ["reqwest"]
native-tls-vendored = ["reqwest/native-tls-vendored"]

# A backend that hands every request to the JavaScript host. Selected over
# reqwest and curl when enabled, since a wasm build cannot have those anyway.
wasm-fetch = []

[package.metadata.internal_dep_versions]
texyon_errors = "e04798bcd9b1c1d68cc0a318a710bb30230a0300"
texyon_status_base = "401387acfd98113133db6981c301426431f55ea3"
