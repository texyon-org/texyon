lints.workspace = true

[package]
name = "texyon_bridge_fontconfig"
license = "MIT"
version = "0.0.0-dev.0"
edition = "2024"
links = "fontconfig"
description = """
Exposing fontconfig APIs to the Tectonic C/C++ and Rust code.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bridge_fontconfig"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"

[dependencies]
libc = "0.2"
texyon_bridge_png = { path = "../bridge_png", version = "0.0.0-dev.0" }

[build-dependencies]
texyon_dep_support = { path = "../dep_support", version = "0.0.0-dev.0" }

