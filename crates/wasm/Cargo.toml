lints.workspace = true

[package]
name = "texyon_wasm"
version = "0.0.0-dev.0"
authors = ["the Tectonic Project"]
description = """
Tectonic's live-preview engine as a WebAssembly module, for running LaTeX in a
browser.
"""
homepage = "https://github.com/texyon-org/texyon"
repository = "https://github.com/texyon-org/texyon"
license = "MIT"
edition = "2021"

[lib]
# cdylib so the wasm target produces a standalone module. rlib keeps the crate
# checkable on the host, where the C ABI below is inert.
crate-type = ["cdylib", "rlib"]

# Replaces wasi-libc's malloc, see src/alloc_shim.rs.
[target.'cfg(target_family = "wasm")'.dependencies]
dlmalloc = "^0.2"

[dependencies]
libc = "^0.2"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
texyon_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
texyon_engine_xetex = { path = "../engine_xetex", version = "0.0.0-dev.0" }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
# The preview pipeline, minus everything that assumes a host operating system.
texyon_live_preview = { path = "../live_preview", version = "0.0.0-dev.0", default-features = false }
texyon_preview_protocol = { path = "../preview_protocol", version = "0.0.0-dev.0" }
texyon_preview_render = { path = "../preview_render", version = "0.0.0-dev.0", features = [
    "backend-mupdf",
] }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }
texyon_xdv = { path = "../xdv", version = "0.0.0-dev.0" }

[package.metadata.internal_dep_versions]
texyon_bridge_core = "thiscommit:2026-08-19:wasm-engine"
texyon_engine_xetex = "thiscommit:2026-08-19:wasm-engine"
texyon_errors = "thiscommit:2026-08-19:wasm-engine"
texyon_io_base = "thiscommit:2026-08-19:wasm-engine"
texyon_live_preview = "thiscommit:2026-08-19:wasm-engine"
texyon_preview_protocol = "thiscommit:2026-08-19:wasm-engine"
texyon_preview_render = "thiscommit:2026-08-19:wasm-engine"
texyon_status_base = "thiscommit:2026-08-19:wasm-engine"
texyon_xdv = "thiscommit:2026-08-19:wasm-engine"
