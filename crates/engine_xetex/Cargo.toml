lints.workspace = true

[package]
name = "texyon_engine_xetex"
version = "0.0.0-dev.0" 
authors = ["Peter Williams <peter@newton.cx>"]
description = """
The [XeTeX](http://xetex.sourceforge.net/) engine as a reusable crate.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_engine_xetex"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"
links = "texyon_engine_xetex"

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
libc = "^0.2"
texyon_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
texyon_bridge_freetype2 = { path = "../bridge_freetype2", version = "0.0.0-dev.0" }
texyon_bridge_flate = { path = "../bridge_flate", version = "0.0.0-dev.0" }
texyon_bridge_graphite2 = { path = "../bridge_graphite2", version = "0.0.0-dev.0" }
texyon_bridge_harfbuzz = { path = "../bridge_harfbuzz", version = "0.0.0-dev.0" }
texyon_bridge_icu = { path = "../bridge_icu", version = "0.0.0-dev.0" }
texyon_errors = { path = "../errors", version = "0.0.0-dev.0" }
texyon_pdf_io = { path = "../pdf_io", version = "0.0.0-dev.0" }
texyon_xetex_layout = { path = "../xetex_layout", version = "0.0.0-dev.0" }

[dev-dependencies]
texyon_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
texyon_status_base = { path = "../status_base", version = "0.0.0-dev.0" }

[build-dependencies]
cc = "^1.0.66"
texyon_cfg_support = { path = "../cfg_support", version = "0.0.0-dev.0" }

[features]
external-harfbuzz = [
    "texyon_bridge_harfbuzz/external-harfbuzz",
    "texyon_xetex_layout/external-harfbuzz",
]

