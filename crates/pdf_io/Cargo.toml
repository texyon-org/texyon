lints.workspace = true

[package]
name = "texyon_pdf_io"
version = "0.0.0-dev.0" 
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Xdvipdfmx’s PDF, XDV, and image I/O APIs in C, as a Rust crate.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_pdf_io"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"
links = "texyon_pdf_io"

[dependencies]
texyon_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
texyon_bridge_flate = { path = "../bridge_flate", version = "0.0.0-dev.0" }
texyon_bridge_png = { path = "../bridge_png", version = "0.0.0-dev.0" }

[build-dependencies]
cc = "^1.0.66"
texyon_cfg_support = { path = "../cfg_support", version = "0.0.0-dev.0" }

