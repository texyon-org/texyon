lints.workspace = true

[package]
name = "texyon_bridge_harfbuzz"
version = "0.0.0-dev.0" # assigned with cranko (see README)
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Expose the Harfbuzz C/C++ APIs to Rust/Cargo.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon_bridge_harfbuzz"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"
links = "harfbuzz"
exclude = ["/harfbuzz/docs/", "/harfbuzz/perf/", "/harfbuzz/test/"]

[dependencies]
texyon_bridge_freetype2 = { path = "../bridge_freetype2", version = "0.0.0-dev.0" }
texyon_bridge_graphite2 = { path = "../bridge_graphite2", version = "0.0.0-dev.0" }
libc = "0.2"

# wasm compiles HarfBuzz's FreeType integration, which the rest of the tree does
# not need; see build.rs for why.
[target.'cfg(target_family = "wasm")'.dependencies]
texyon_bridge_freetype2 = { path = "../bridge_freetype2", version = "0.0.0-dev.0" }

[build-dependencies]
cc = "^1.0.66"
texyon_dep_support = { path = "../dep_support", version = "0.0.0-dev.0" }
texyon_cfg_support = { path = "../cfg_support", version = "0.0.0-dev.0" }

[target.'cfg(target_os = "macos")'.dependencies]
texyon_mac_core = { path = "../mac_core", version = "0.0.0-dev.0" }

[features]
external-harfbuzz = []

[package.metadata.internal_dep_versions]
texyon_bridge_freetype2 = "2c1ffcd702a662c003bd3d7d0ca4d169784cb6ad"
texyon_bridge_graphite2 = "2722731f9e32c6963fe8c8566a201b33672c5c5a"
texyon_mac_core = "6932d5f15fec0fb5c219b887bdd11b72641af07a"
texyon_dep_support = "5faf4205bdd3d31101b749fc32857dd746f9e5bc"
texyon_cfg_support = "thiscommit:aeRoo7oa"
