lints.workspace = true

[package]
name = "texyon_xdv"
version = "0.0.0-dev.0"
authors = ["Peter Williams <peter@newton.cx>"]
description = """
A decoder for the XDV and SPX file formats used by XeTeX and Tectonic.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
license = "MIT"
edition = "2021"

[dependencies]
byteorder = "^1.4"

[dev-dependencies]
clap = { version = "4.5.1", features = ["cargo"] }
