# The routine checks: formatting and a native Linux build-and-test. The VS Code
# extension is built and released by vscode.yml.

name: "CI"

on:
  pull_request:
  push:
    branches: [ master ]

# A push during a run supersedes it; finishing the old run would waste the
# minutes it has left. PRs get their own group per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: "Install rustfmt"
        run: rustup component add rustfmt
      - name: "cargo fmt"
        run: cargo fmt --all -- --check
  test:
    runs-on: ubuntu-latest
    # A stuck job burns paid minutes for six hours by default.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Generic Setup"
        uses: ./.github/actions/build-setup
      - uses: Swatinem/rust-cache@v2
      - name: "Install pkg-config dependencies"
        uses: ./.github/actions/pkgconfig-deps
      - name: "Setup build variables"
        shell: bash
        run: |
          echo "TEXYON_DEP_BACKEND=pkg-config" >> "$GITHUB_ENV"
      - name: "Build and Test"
        uses: ./.github/actions/build-and-test
        with:
          target: x86_64-unknown-linux-gnu
      - name: "Clippy (engine_xetex)"
        # Same profile and target as the build step, to reuse its build script outputs.
        run: |
          rustup component add clippy
          cargo clippy -p texyon_engine_xetex --all-targets --release --target x86_64-unknown-linux-gnu -- -D warnings
