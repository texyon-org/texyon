# The full cranko release machinery: version assignment, the complete build
# matrix, and deployment. Deliberately not part of the master push CI — it runs
# when rc is pushed, or on demand.

name: "Release"

on:
  workflow_dispatch:
  push:
    branches: [ rc ]

jobs:
  prep:
    uses: ./.github/workflows/prep.yml
  build_and_test:
    needs: prep
    uses: ./.github/workflows/build_and_test.yml
    secrets: inherit
  deploy:
    needs: build_and_test
    uses: ./.github/workflows/deploy.yml
    with:
      is-dev: ${{ github.ref_name == 'master' }}
      is-release: ${{ github.ref_name == 'rc' }}
    secrets: inherit
