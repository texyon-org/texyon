# Builds the VS Code extension with a bundled preview engine, one VSIX per
# platform. A vscode-v* tag also publishes them; a manual run only builds.

name: "VS Code Extension"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build only this platform"
        type: choice
        options: [ all, linux-x64, darwin-arm64, win32-x64 ]
        default: all
  push:
    tags: [ "vscode-v*" ]

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A manual run can build one platform, so a trial does not pay for macOS.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          # 22.04 for an older glibc baseline.
          all='[
            {"image": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "vsce-target": "linux-x64",
             "features": "preview-mupdf,native-tls-vendored"},
            {"image": "macos-14", "target": "aarch64-apple-darwin", "vsce-target": "darwin-arm64",
             "features": "preview-mupdf", "vcpkg-triplet": "arm64-osx-release"},
            {"image": "windows-latest", "target": "x86_64-pc-windows-msvc", "vsce-target": "win32-x64",
             "features": "preview-mupdf", "vcpkg-triplet": "x64-windows-static-release"}
          ]'
          echo "include=$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .["vsce-target"] == $p))' <<< "$all")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.image }}
    # A cold vcpkg cache rebuilds ICU and friends.
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/build/vcpkg/vcpkg-ports
      # Host tools (ICU's among them) otherwise build as a second, debug+release copy.
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.vcpkg-triplet }}
      VCPKGRS_TRIPLET: ${{ matrix.vcpkg-triplet }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: "Set up Rust"
        shell: bash
        run: |
          rustup set profile minimal
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: "Install pkg-config dependencies"
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/pkgconfig-deps
      # Release assets do not expire like the Actions cache, so a cold vcpkg
      # build only happens when the dependency set changes.
      - name: "Restore prebuilt vcpkg packages"
        id: vcpkg-binaries
        if: ${{ runner.os != 'Linux' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # vcpkg keys every package by its own ABI hash, so one archive per
          # target serves any change and only the affected packages rebuild.
          name="vcpkg-${{ matrix.target }}.tar"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir -p target/vcpkg-cache
          if gh release download vcpkg-binaries -p "$name" -D "$RUNNER_TEMP"; then
            # GNU tar reads a drive letter in the archive path as a remote host.
            ws="$PWD"
            (cd "$RUNNER_TEMP" && tar -xf "$name" -C "$ws/target/vcpkg-cache")
          fi
          (cd target/vcpkg-cache && find . -name '*.zip' | sort) > "$RUNNER_TEMP/restored.txt"
      # vcpkg does not hash the bundled HarfBuzz headers MuPDF compiles against,
      # so the port pins their version and a cached MuPDF must match it.
      - name: "Check the MuPDF port's HarfBuzz pin"
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          pin="$(sed -n 's/^set(BUNDLED_HARFBUZZ_VERSION "\(.*\)")$/\1/p' build/vcpkg/vcpkg-ports/libmupdf/portfile.cmake)"
          if ! grep -qx "#define HB_VERSION_STRING \"$pin\"" crates/bridge_harfbuzz/harfbuzz/src/hb-version.h; then
            echo "::error::build/vcpkg/vcpkg-ports/libmupdf pins HarfBuzz '$pin' but the submodule is $(grep HB_VERSION_STRING crates/bridge_harfbuzz/harfbuzz/src/hb-version.h | tail -1)"
            exit 1
          fi
      - name: "Install vcpkg dependencies"
        if: ${{ runner.os != 'Linux' }}
        uses: ./.github/actions/vcpkg-deps
        with:
          target: ${{ matrix.target }}
      # vcpkg reuses a package only if its ABI, which includes the compiler, still
      # matches. Keep what this build used and upload whenever that changed, so a
      # runner image update costs one cold build instead of every build after it.
      - name: "Save prebuilt vcpkg packages"
        if: ${{ runner.os != 'Linux' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.vcpkg-binaries.outputs.name }}
        run: |
          sha=sha256sum
          command -v sha256sum >/dev/null || sha="shasum -a 256"
          ws="$PWD"
          # A cached package is named by the SHA-256 of its vcpkg_abi_info.txt.
          used="$(find target/vcpkg/installed -name vcpkg_abi_info.txt -exec $sha {} + | cut -c1-64 | sort -u)"
          if [[ -z "$used" ]]; then
            echo "::warning::found no installed vcpkg packages, leaving the cache as it is"
            exit 0
          fi
          cd target/vcpkg-cache
          stale="$(find . -name '*.zip' | while read -r zip; do
            grep -qx "$(basename "$zip" .zip)" <<< "$used" || echo "$zip"
          done)"
          if [[ -n "$stale" ]] && [[ "$(wc -l <<< "$stale")" -lt "$(find . -name '*.zip' | wc -l)" ]]; then
            xargs rm <<< "$stale"
          elif [[ -n "$stale" ]]; then
            echo "::warning::no cached package matched an installed ABI, keeping them all"
          fi
          if find . -name '*.zip' | sort | cmp -s - "$RUNNER_TEMP/restored.txt"; then
            echo "The prebuilt packages are current."
            exit 0
          fi
          (cd "$RUNNER_TEMP" && tar -cf "$NAME" -C "$ws/target/vcpkg-cache" .)
          gh release view vcpkg-binaries >/dev/null 2>&1 \
            || gh release create vcpkg-binaries --title "Prebuilt vcpkg packages" \
                 --notes "vcpkg binary caches for the VS Code extension builds, keyed by dependency set." --prerelease
          gh release upload vcpkg-binaries "$RUNNER_TEMP/$NAME" --clobber
      - name: "Setup build variables (Linux)"
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          echo "TEXYON_DEP_BACKEND=pkg-config" >> "$GITHUB_ENV"
          echo "TEXYON_PKGCONFIG_FORCE_SEMI_STATIC=true" >> "$GITHUB_ENV"
      - name: "Setup build variables (vcpkg)"
        if: ${{ runner.os != 'Linux' }}
        shell: bash
        run: |
          echo "TEXYON_DEP_BACKEND=vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/target/vcpkg" >> "$GITHUB_ENV"
      - name: "Setup build variables (Windows)"
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          echo "RUSTFLAGS=-Ctarget-feature=+crt-static" >> "$GITHUB_ENV"
      - name: "Build MuPDF"
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mupdf.com refuses connections from the runners.
          gh release download vendor-deps -p 'mupdf-*-source.tar.gz' -D "$RUNNER_TEMP"
          export MUPDF_TARBALL="$(echo "$RUNNER_TEMP"/mupdf-*-source.tar.gz)"
          if [[ $RUNNER_OS == macOS ]]; then
            prefix="$VCPKG_ROOT/installed/${{ matrix.vcpkg-triplet }}/include"
            export FREETYPE_CFLAGS="-I$prefix/freetype2 -I$prefix" ZLIB_CFLAGS="-I$prefix"
          fi
          tools/mupdf/build.sh
          echo "TEXYON_MUPDF_DIR=$GITHUB_WORKSPACE/tools/mupdf/vendor/mupdf" >> "$GITHUB_ENV"
      - name: "Build texyon"
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p texyon --features "${{ matrix.features }}"
          mkdir -p packages/vscode/bin
          if [[ $RUNNER_OS == Windows ]]; then
            cp target/${{ matrix.target }}/release/texyon.exe packages/vscode/bin/
          else
            cp target/${{ matrix.target }}/release/texyon packages/vscode/bin/
            strip packages/vscode/bin/texyon
          fi
          cp licenses/AGPL-3.0.txt packages/vscode/bin/LICENSE
          cp THIRD_PARTY_NOTICES.md packages/vscode/bin/
      - name: "Show dynamic dependencies"
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          if [[ $RUNNER_OS == macOS ]]; then otool -L packages/vscode/bin/texyon; else ldd packages/vscode/bin/texyon; fi
      - name: "Install extension dependencies"
        shell: bash
        working-directory: packages/vscode
        run: npm ci --omit=dev
      - name: "Package"
        shell: bash
        working-directory: packages/vscode
        run: npx -y @vscode/vsce@3.2.1 package --target ${{ matrix.vsce-target }} -o "texyon-${{ matrix.vsce-target }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce-target }}
          path: packages/vscode/*.vsix
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/vscode-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: "Check the tag matches the extension version"
        run: |
          version="$(node -p 'require("./packages/vscode/package.json").version')"
          if [[ "vscode-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Publish to the VS Code Marketplace"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::warning::VSCE_PAT is not set, upload dist/*.vsix to the Marketplace by hand"
            exit 0
          fi
          version="${GITHUB_REF_NAME#vscode-v}"
          query='{"filters":[{"criteria":[{"filterType":7,"value":"texyon.texyon"}]}],"flags":1}'
          for vsix in dist/*.vsix; do
            target="$(basename "$vsix" .vsix)"
            target="${target#texyon-}"
            npx -y @vscode/vsce@3.2.1 publish --packagePath "$vsix"
            # The Marketplace drops a target uploaded while another one of the same version is still validating.
            for _ in $(seq 60); do
              curl -s -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
                  -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=7.2-preview.1' -d "$query" \
                | jq -e --arg v "$version" --arg t "$target" \
                    '[.results[].extensions[].versions[] | select(.version == $v and .targetPlatform == $t)] | length > 0' >/dev/null \
                && continue 2
              sleep 30
            done
            echo "::error::$target $version did not appear on the Marketplace within 30 minutes"
            exit 1
          done
      - name: "Publish to Open VSX"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ "$(curl -s -o /dev/null -w '%{http_code}' https://open-vsx.org/api/texyon)" == 404 ]]; then
            npx -y ovsx@0.10.1 create-namespace texyon
          fi
          for vsix in dist/*.vsix; do
            npx -y ovsx@0.10.1 publish "$vsix"
          done
      - name: "Create the GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --title "VS Code extension ${GITHUB_REF_NAME#vscode-v}" --generate-notes
