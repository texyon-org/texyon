# Builds the @texyon/wasm package with its module and support pack. A wasm-v*
# tag also publishes it to npm; a manual run only builds.

name: "Wasm Package"

on:
  workflow_dispatch:
  push:
    tags: [ "wasm-v*" ]

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Check the tag matches the package version"
        if: ${{ startsWith(github.ref, 'refs/tags/wasm-v') }}
        run: |
          version="$(jq -r .version packages/wasm/package.json)"
          if [ "${GITHUB_REF_NAME#wasm-v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: "Set up Rust"
        run: |
          rustup set profile minimal
          rustup update --no-self-update stable
          rustup default stable
          rustup target add wasm32-wasip1
      - name: "Install pkg-config dependencies"
        uses: ./.github/actions/pkgconfig-deps
      - name: "Install wasm-opt"
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y binaryen
      # mupdf.com periodically refuses Azure's address space.
      - name: "Seed mupdf from the vendor-deps release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools/wasm/vendor/mupdf
          gh release download vendor-deps --pattern 'mupdf-1.24.9-source.tar.gz' --output - \
            | tar xz -C tools/wasm/vendor/mupdf --strip-components=1
      - name: "Fetch the wasm toolchain and vendored sources"
        run: |
          curl -fsSL --retry 3 "$WASI_SDK_URL" | tar xz -C tools/wasm
          tools/wasm/fetch-deps.sh --with-mupdf
      - name: "Build the module"
        run: tools/wasm/build.sh
      - name: "Build the support pack"
        env:
          TEXYON_DEP_BACKEND: pkg-config
        run: |
          cargo build --release --locked -p texyon
          tools/wasm/build-assets.sh
      - name: "Smoke-test the module"
        run: node tools/wasm/smoke-test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: "Test and pack"
        working-directory: packages/wasm
        run: |
          npm ci
          npm run typecheck
          npm test
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: packages/wasm/texyon-wasm-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/wasm-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: "Publish to npm"
        run: npm publish texyon-wasm-*.tgz --access public
