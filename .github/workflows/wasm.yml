# Builds the @texyon/wasm package with its module and support pack. A wasm-v*
# tag also publishes it to npm; a manual run only builds.

name: "Wasm Package"

on:
  workflow_dispatch:
  push:
    tags: [ "wasm-v*" ]

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEXYON_DEP_BACKEND: pkg-config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: "Check the tag matches the package version"
        if: ${{ startsWith(github.ref, 'refs/tags/wasm-v') }}
        run: |
          version="$(jq -r .version packages/wasm/package.json)"
          if [ "${GITHUB_REF_NAME#wasm-v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      # Rust 1.100 builds a module that hangs on its first compile.
      - name: "Set up Rust"
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --target wasm32-wasip1 --component llvm-tools
          rustup default 1.97.1
      - name: "Install pkg-config dependencies"
        uses: ./.github/actions/pkgconfig-deps
      - name: "Install wasm-opt"
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y binaryen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # mupdf.com periodically refuses Azure's address space.
      - name: "Fetch the wasm toolchain and C libraries"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download vendor-deps --pattern 'mupdf-1.24.9-source.tar.gz' --dir "$RUNNER_TEMP"
          cargo xtask deps --mupdf --mupdf-source "$RUNNER_TEMP/mupdf-1.24.9-source.tar.gz"
      - name: "Build the support pack"
        run: cargo xtask pack
      - name: "Build the module"
        run: cargo xtask wasm --pgo
      - name: "Test the module"
        run: cargo xtask test wasm
      - name: "Test and pack"
        working-directory: packages/wasm
        run: |
          npm ci
          npm run typecheck
          npm test
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: packages/wasm/texyon-wasm-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/wasm-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: "Publish to npm"
        run: npm publish texyon-wasm-*.tgz --access public
