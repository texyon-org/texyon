# Server and client checks, plus the contract between them: the committed
# OpenAPI document and generated bindings must match the code.
# Path-filtered so the Rust side never pays for this job.

name: "Editor Checks"

on:
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - "js/**"
      - ".github/workflows/editor-checks.yml"
  push:
    branches: [master]
    paths:
      - "server/**"
      - "client/**"
      - "js/**"
      - ".github/workflows/editor-checks.yml"

concurrency:
  group: editor-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A stuck job burns paid minutes for six hours by default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: "Install server dependencies"
        working-directory: server
        run: composer install --no-interaction --no-progress

      - name: "Server: static analysis and tests"
        working-directory: server
        run: |
          cp .env.example .env
          php artisan key:generate
          composer analyse
          php artisan test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            js/package-lock.json

      # The client's typecheck resolves @tectonic/wasm against this build output.
      - name: "Build the engine package's types"
        working-directory: js
        run: |
          npm ci
          npm run build

      - name: "Install client dependencies"
        working-directory: client
        run: npm ci

      - name: "The spec and bindings match the code"
        run: |
          (cd server && composer openapi)
          (cd client && npm run generate:api)
          git diff --exit-code -- server/openapi.json client/src/api

      - name: "Client: typecheck and tests"
        working-directory: client
        run: |
          npm run typecheck
          npm test
