lints.workspace = true

[package]
name = "texyon"
version = "0.0.0-dev.0"
authors = ["Peter Williams <peter@newton.cx>"]
description = """
A fast, embeddable TeX/LaTeX engine: XeTeX ported to Rust, with incremental live preview.
Forked from Tectonic and uses the TeX Live distribution of support files.
"""
homepage = "https://github.com/texyon-org/texyon"
documentation = "https://docs.rs/texyon"
repository = "https://github.com/texyon-org/texyon"
readme = "README.md"
keywords = ["tex", "latex", "typesetting", "font"]
categories = [
    "command-line-interface",
    "parser-implementations",
    "rendering",
    "science",
    "text-processing",
]
license = "MIT"
edition = "2024"
exclude = ["/build/", "/release-bundle/"]

[workspace]
members = [
    "crates/bridge_flate",
    "crates/bridge_fontconfig",
    "crates/bridge_freetype2",
    "crates/bridge_graphite2",
    "crates/bridge_harfbuzz",
    "crates/bridge_icu",
    "crates/bridge_png",
    "crates/bundles",
    "crates/cfg_support",
    "crates/dep_support",
    "crates/engine_bibtex",
    "crates/engine_xdvipdfmx",
    "crates/engine_xetex",
    "crates/errors",
    "crates/geturl",
    "crates/io_base",
    "crates/live_preview",
    "crates/mac_core",
    "crates/pdf_io",
    "crates/preview_protocol",
    "crates/preview_render",
    "crates/status_base",
    "crates/wasm",
    "crates/xdv",
    "crates/xetex_layout",
]

[workspace.lints.rust]
# FIXME(CraftSpider): Switch from error-chain to a newer package, as it's a deprecated project
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(has_error_description_deprecated)'] }
missing_docs = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "texyon"
crate-type = ["rlib"]

[dependencies]
byte-unit = "^5.0"
error-chain = "^0.12"
flate2 = { version = "^1.0.19", default-features = false, features = ["zlib"] }
lazy_static = "^1.4"
quick-xml = "0.37"
serde = { version = "^1.0", features = ["derive"] }
sha2 = "^0.10"
clap = { version = "4.5.1", features = ["derive"] }
texyon_bridge_core = { path = "crates/bridge_core", version = "0.0.0-dev.0" }
texyon_bundles = { path = "crates/bundles", version = "0.0.0-dev.0", default-features = false }
texyon_engine_bibtex = { path = "crates/engine_bibtex", version = "0.0.0-dev.0" }
texyon_engine_xdvipdfmx = { path = "crates/engine_xdvipdfmx", version = "0.0.0-dev.0" }
texyon_engine_xetex = { path = "crates/engine_xetex", version = "0.0.0-dev.0" }
texyon_errors = { path = "crates/errors", version = "0.0.0-dev.0" }
texyon_geturl = { path = "crates/geturl", version = "0.0.0-dev.0", default-features = false }
texyon_io_base = { path = "crates/io_base", version = "0.0.0-dev.0" }
texyon_live_preview = { path = "crates/live_preview", version = "0.0.0-dev.0" }
texyon_preview_protocol = { path = "crates/preview_protocol", version = "0.0.0-dev.0" }
texyon_preview_render = { path = "crates/preview_render", version = "0.0.0-dev.0" }
texyon_status_base = { path = "crates/status_base", version = "0.0.0-dev.0" }
texyon_xdv = { path = "crates/xdv", version = "0.0.0-dev.0" }
texyon_xetex_layout = { path = "crates/xetex_layout", version = "0.0.0-dev.0" }
tempfile = "^3.1"
termcolor = "^1.1"
toml = "^0.8"
which = "8.0"
zip = { version = "4.0", default-features = false, features = ["deflate"] }
walkdir = "2"
regex = "1.10.2"
anyhow = "1.0.80"
tar = "0.4.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The CLI itself is likewise native-only. Making it require a feature that is on
# by default keeps `cargo build` behaving exactly as before while letting a
# --no-default-features wasm build skip the binary instead of failing on it.
[[bin]]
name = "texyon"
path = "src/bin/texyon/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "geturl-reqwest"]

# The command-line program, which a WebAssembly build of the library skips.
cli = []

external-harfbuzz = ["texyon_engine_xetex/external-harfbuzz"]

geturl-curl = ["texyon_bundles/geturl-curl", "texyon_geturl/curl"]
geturl-reqwest = ["texyon_bundles/geturl-reqwest", "texyon_geturl/reqwest"]
geturl-wasm-fetch = [
    "texyon_bundles/geturl-wasm-fetch",
    "texyon_geturl/wasm-fetch",
]

native-tls-vendored = [
    "texyon_bundles/native-tls-vendored",
    "texyon_geturl/native-tls-vendored",
]

# developer feature to compile with the necessary flags for profiling tectonic.
profile = []

# The native SVG backend links MuPDF, whose distribution terms are AGPL.
# Keep it opt-in so the portable/MIT library build remains unchanged.
preview-mupdf = [
    "texyon_live_preview/preview-mupdf",
    "texyon_preview_render/backend-mupdf",
]

[dev-dependencies]
filetime = "^0.2"
sha2 = "^0.10"
serde_json = "1.0"
tempfile = "^3.1"

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "a62ce77d56ee07513b4b67de1ec2daeaebfae51a"
overlay-triplets-path = "build/vcpkg/vcpkg-triplets"

# If other targets start using custom triplets like x86_64-pc-windows-msvc,
# add them to crates/dep_support/src/lib.rs:new_from_vcpkg() to give users
# guidance if they might need to set $VCPKGRS_TRIPLET.
[package.metadata.vcpkg.target]
x86_64-apple-darwin = { triplet = "x64-osx", install = ["fontconfig", "freetype", "harfbuzz[graphite2]", "icu"] }
aarch64-apple-darwin = { triplet = "arm64-osx-release", install = [
    "fontconfig",
    "freetype",
    "harfbuzz[graphite2]",
    "icu",
] }
x86_64-unknown-linux-gnu = { install = [
    "fontconfig",
    "freetype",
    "harfbuzz[graphite2]",
    "icu",
] }
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-release", install = [
    "fontconfig",
    "freetype",
    "graphite2",
    "icu",
    "libmupdf",
] }


[profile.release]
# One unit keeps inlining in the engine hot loops stable across unrelated changes.
codegen-units = 1
